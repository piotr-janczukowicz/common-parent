name: Release package (reusable)

# Deploys the next version of a library to GitHub Packages, tags it and creates the GitHub release. Reusable: every
# repository calls it from its Release workflow, then calls reusable-next-snapshot.yml with `v` plus the version it returns. common-parent itself keeps its own
# release.yml: it also sets the `common-build-config.version` property and releases every module.
#
# The version is the pom version without -SNAPSHOT (`N`, or `X.Y.Z.N`): the number N is the one after the newest
# `v<prefix>*` tag, or the N of the pom when that is higher or there is no tag yet. It only runs on the default branch.
# The release profile skips tests and checks, so the deploy waits for a green Main run (main.yml) of the same commit.
# If the deploy fails after it uploaded some files, GitHub Packages may refuse the same version again: delete that
# package version, then run the workflow again.
#
# The caller grants at least the permissions of the job below, passes `secrets: inherit` and sets a `concurrency` group.
on:
  workflow_call:
    secrets:
      PACKAGES_TOKEN:
        required: true
    outputs:
      release:
        description: The released version, without the leading v
        value: ${{ jobs.release.outputs.release }}

jobs:
  release:
    permissions:
      actions: read
      contents: write
      packages: write
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Fail unless Main passed on this commit
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful Main run for $GITHUB_SHA; wait for it to pass before releasing"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
      - name: Resolve release version
        id: version
        run: |
          current=$(mvn -B -ntp -s .github/maven-settings.xml -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$current" =~ ^(([0-9]+\.)*)([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::Expected version [X.Y.Z.]N-SNAPSHOT with integer N, found '$current'"
            exit 1
          fi
          prefix=${BASH_REMATCH[1]}
          floor=${BASH_REMATCH[3]}
          # A failed query must stop the release: reading it as "no tags yet" could deploy a version that exists.
          if ! tags=$(git ls-remote --tags --refs origin "refs/tags/v${prefix}*"); then
            echo "::error::Could not list the tags of origin"
            exit 1
          fi
          # grep exits 1 when no tag has a number after the prefix; that is an empty result, not a failure.
          last=$(printf '%s\n' "$tags" | sed -E "s#.*refs/tags/v${prefix//./[.]}##" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          if [ -z "$last" ]; then revision=$floor; else revision=$(( floor > last ? floor : last + 1 )); fi
          echo "release=${prefix}${revision}" >> "$GITHUB_OUTPUT"
      - name: Fail if tag exists
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE" > /dev/null || status=$?
          case "$status" in
            0) echo "::error::Tag v$RELEASE already exists"; exit 1 ;;
            2) ;; # no such tag: the version is free
            *) echo "::error::Could not query the tags of origin (git exit $status)"; exit 1 ;;
          esac
        env:
          RELEASE: ${{ steps.version.outputs.release }}
      - name: Set release version
        run: mvn -B -ntp -s .github/maven-settings.xml versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
        env:
          RELEASE: ${{ steps.version.outputs.release }}
      - name: Deploy to GitHub Packages
        run: mvn -B -ntp -s .github/maven-settings.xml deploy -DdeployAtEnd=false -Prelease -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)"
      - name: Tag and create GitHub release
        run: gh release create "v$RELEASE" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.version.outputs.release }}
    outputs:
      release: ${{ steps.version.outputs.release }}
