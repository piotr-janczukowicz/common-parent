name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-pull-request.yml
    secrets: inherit
