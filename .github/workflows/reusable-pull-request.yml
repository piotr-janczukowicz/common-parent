name: Pull request checks

# Verifies a pull request with one Maven build, which CodeQL observes (init before, analyze after), so the project is
# not built a second time. Other repositories call it from their Pull request workflow:
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#   concurrency: { group: "pull-request-${{ github.event.pull_request.number }}", cancel-in-progress: true }
#   jobs:
#     verify:
#       permissions: { contents: read, security-events: write }
#       uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-pull-request.yml@<commit sha of a vN tag> # vN
#       secrets: inherit
#       # with: { post-build-command: "mvn -B -ntp -s .github/maven-settings.xml test -Pcatalog" }   # catalog tests
# The javadoc profile checks what the Central publish would reject, so no second build of the Central bundle is needed.
# Draft pull requests are skipped (a skipped job still satisfies a required check). Markdown-only changes are still
# built, because Spotless formats Markdown. The checks are named "<caller job> / verify"
# (for example "verify / verify"), so a required status check must use that name. Python checks are opt-in: a repository
# that has them adds its own job calling reusable-python-checks.yml.
on:
  workflow_call:
    inputs:
      maven-args:
        description: Extra Maven arguments
        required: false
        type: string
        default: ""
      post-build-command:
        description: Command run in the verify job after the build and CodeQL, from the repository root, with the Maven settings and credentials available; empty means none
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MAVEN_EXTRA_ARGS: ${{ inputs.maven-args }}
      # Off for private repositories, which need a paid code security licence to upload results, and for fork pull
      # requests, whose read-only token cannot upload them.
      CODEQL: ${{ !github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Initialize CodeQL
        id: codeql
        if: env.CODEQL == 'true' && hashFiles('**/*.java') != ''
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: mvn -B -ntp -s .github/maven-settings.xml clean verify -Pjavadoc $MAVEN_EXTRA_ARGS
      - name: CodeQL analysis
        if: steps.codeql.outcome == 'success'
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:java-kotlin
      # After CodeQL analyze, so the extra run is not traced; the results are uploaded even if it fails.
      - name: Additional command
        if: inputs.post-build-command != ''
        run: ${{ inputs.post-build-command }}
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
