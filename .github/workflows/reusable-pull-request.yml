name: Pull request checks

# Verifies a pull request with one Maven build. Other repositories call it from their Pull request workflow:
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#   concurrency: { group: "pull-request-${{ github.event.pull_request.number }}", cancel-in-progress: true }
#   jobs:
#     verify:
#       uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-pull-request.yml@<commit sha of a vN tag> # vN
#       secrets: inherit
#       # with: { python-command: "bash scripts/ci_checks.sh" }   # repositories that also have Python checks
# The javadoc profile checks what the Central publish would reject, so no second build of the Central bundle is needed.
# Draft pull requests are skipped (a skipped job still satisfies a required check). Markdown-only changes are still
# built, because Spotless formats Markdown. The checks are named "<caller job> / verify" and "<caller job> / scripts"
# (for example "verify / verify"), so a required status check must use that name.
on:
  workflow_call:
    inputs:
      maven-args:
        description: Extra Maven arguments
        required: false
        type: string
        default: ""
      python-command:
        description: Command for a separate Python checks job, from the repository root; empty means no such job
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MAVEN_EXTRA_ARGS: ${{ inputs.maven-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -s .github/maven-settings.xml clean verify -Pjavadoc $MAVEN_EXTRA_ARGS

  scripts:
    if: github.event.pull_request.draft == false && inputs.python-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python checks
        run: ${{ inputs.python-command }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
