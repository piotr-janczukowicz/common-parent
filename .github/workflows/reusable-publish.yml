name: Publish to Maven Central

# Publishes a version that the Release workflow (or a manual release) already tagged: it checks out the tag, builds
# and signs it, and uploads it to Maven Central. Run by hand it takes no inputs, so nobody can change what is built:
# it publishes the newest vN tag, or the tag you run it on when you pick a tag in "Use workflow from". Other
# repositories call it with:
#   uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-publish.yml@<commit sha of a vN tag> # vN
#   secrets: inherit
# A calling workflow, which is reviewed code, may pass `tag`, `maven-args` and `sync-build-config`.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, such as v6 or v2026.3.10.0; empty means the tag the run is on, or the newest vN tag
        required: false
        type: string
        default: ""
      maven-args:
        required: false
        type: string
        default: ""
      sync-build-config:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      MAVEN_EXTRA_ARGS: ${{ inputs.maven-args }}
      # Run by hand (common-parent only), the build config version is synced too.
      SYNC_BUILD_CONFIG: ${{ github.event_name == 'workflow_dispatch' && 'true' || inputs.sync-build-config }}
    steps:
      - name: Resolve and check the tag
        run: |
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            # The newest tag of the form v6 or v2026.3.10.0, by version order.
            if ! refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref'); then
              echo "::error::Could not list the tags of $GITHUB_REPOSITORY"
              exit 1
            fi
            TAG=$(echo "$refs" | sed 's#^refs/tags/##' | { grep -E '^v[0-9]+(\.[0-9]+)*$' || true; } | sort -V | tail -1)
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::The tag must look like v6 or v2026.3.10.0, found '$TAG'"
            exit 1
          fi
          echo "Publishing $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Show the imported signing key
        run: gpg --list-secret-keys --keyid-format long
      - name: Set the release version
        run: |
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
          if [[ "$SYNC_BUILD_CONFIG" == "true" ]]; then
            mvn -B -s .github/maven-settings.xml versions:set-property -Dproperty=common-build-config.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          fi
      - name: Publish to Maven Central
        run: mvn -B -s .github/maven-settings.xml deploy -Pcentral -Prelease -Dgpg.keyname=E1A4492D376821D0680C6C758D93BEA6026504E0 -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)" $MAVEN_EXTRA_ARGS
