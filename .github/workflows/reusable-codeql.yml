name: CodeQL analysis

# Scans a Maven repository. Costly, so the caller runs it on pushes to the default branch and weekly, not on pull
# requests. Other repositories call it with:
#   on:
#     push: { branches: [main] }
#     schedule: [{ cron: "17 3 * * 1" }]
#   jobs:
#     analyze:
#       permissions: { contents: read, security-events: write }
#       uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-codeql.yml@<commit sha of a vN tag> # vN
#       secrets: inherit
on:
  workflow_call:
    secrets:
      PACKAGES_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile the main sources
        run: mvn -B -ntp -s .github/maven-settings.xml -DskipTests clean compile
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
