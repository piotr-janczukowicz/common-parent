name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -s .github/maven-settings.xml clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
      - name: Resolve release version
        id: version
        run: |
          current=$(mvn -B -s .github/maven-settings.xml -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$current" =~ ^([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::Expected version N-SNAPSHOT with integer N, found '$current'"
            exit 1
          fi
          release=${BASH_REMATCH[1]}
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "next=$((release + 1))-SNAPSHOT" >> "$GITHUB_OUTPUT"
      - name: Fail if tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.release }}"; then
            echo "::error::Tag v${{ steps.version.outputs.release }} already exists"
            exit 1
          fi
      - name: Set release version
        run: |
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.release }} -DprocessAllModules -DgenerateBackupPoms=false
          mvn -B -s .github/maven-settings.xml versions:set-property -Dproperty=common-build-config.version -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Show the imported signing key
        run: gpg --list-secret-keys --keyid-format long
      - name: Publish to Maven Central
        run: mvn -B deploy -Pcentral -pl . -Dgpg.keyname=E1A4492D376821D0680C6C758D93BEA6026504E0
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Deploy to GitHub Packages
        run: mvn -B -s .github/maven-settings.xml deploy -DdeployAtEnd=false -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Tag and create GitHub release
        run: gh release create "v${{ steps.version.outputs.release }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bump to next snapshot
        run: |
          git checkout -- pom.xml
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.next }} -DprocessAllModules -DgenerateBackupPoms=false
          mvn -B -s .github/maven-settings.xml versions:set-property -Dproperty=common-build-config.version -DnewVersion=${{ steps.version.outputs.next }} -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
