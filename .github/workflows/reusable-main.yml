name: Main checks

# Verifies the default branch after a merge. The Release workflows wait for a green run of this workflow's caller (it
# must be named main.yml) on the same commit, so it never skips anything. Other repositories call it from their Main workflow:
#   on: { push: { branches: [main] } }
#   concurrency: { group: main, cancel-in-progress: true }
#   jobs:
#     verify:
#       permissions: { contents: read, security-events: write }
#       uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-main.yml@<commit sha of a vN tag> # vN
#       secrets: inherit
#       # with: { coverage-report: target/site/jacoco/jacoco.xml }   # uploads coverage to Codacy
on:
  workflow_call:
    inputs:
      maven-args:
        description: Extra Maven arguments
        required: false
        type: string
        default: ""
      coverage-report:
        description: JaCoCo XML report to upload to Codacy; empty means no upload
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MAVEN_EXTRA_ARGS: ${{ inputs.maven-args }}
      # Off for private repositories, which need a paid code security licence to upload results.
      CODEQL: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Initialize CodeQL
        id: codeql
        if: env.CODEQL == 'true' && hashFiles('**/*.java') != ''
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: mvn -B -ntp -s .github/maven-settings.xml clean verify $MAVEN_EXTRA_ARGS
      - name: CodeQL analysis
        if: steps.codeql.outcome == 'success'
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:java-kotlin
      - name: Upload coverage to Codacy
        if: inputs.coverage-report != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ inputs.coverage-report }}
